<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Main content -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">
    WATARU MAEDA
  </text>

  <text x="600" y="330" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#9CA3AF" text-anchor="middle">
    Full-Stack Software Engineer
  </text>

  <!-- Accent bar -->
  <rect x="400" y="355" width="400" height="4" fill="#3B82F6" rx="2"/>

  <!-- Website URL -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#9CA3AF" text-anchor="middle">
    watarumaeda.com
  </text>
</svg>
